        // Initialize
        toggleSearchClear();
        // ============ WAKE LOCK - KEEP PLAYING WHEN SCREEN LOCKED ============
        let wakeLock = null;
        let keepAliveInterval = null;

        async function requestWakeLock() {
            if ('wakeLock' in navigator && !audio.paused) {
                try {
                    if (wakeLock) await wakeLock.release();
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('Wake Lock active - playback protected');
                } catch (err) {
                    console.log('Wake Lock error:', err);
                }
            }
        }

        function releaseWakeLock() {
            if (wakeLock) {
                wakeLock.release();
                wakeLock = null;
            }
        }

        // Keep-alive to ensure next song plays even when screen is locked
        function startKeepAlive() {
            if (keepAliveInterval) clearInterval(keepAliveInterval);
            keepAliveInterval = setInterval(() => {
                // Check if audio is playing and near the end
                if (!audio.paused && audio.src && !audio.ended && !isPlayingNext) {
                    if (audio.duration && audio.currentTime >= audio.duration - 0.5) {
                        // Manually trigger ended if needed
                        if (!audio.ended) {
                            console.log('Keep-alive: Manually triggering ended event');
                            audio.dispatchEvent(new Event('ended'));
                        }
                    }
                }

                // If audio is paused but shouldn't be, try to resume
                if (audio.paused && currentPlayingSong && !isPlayingNext && audio.currentTime > 0 && audio.currentTime < audio.duration - 0.5) {
                    console.log('Keep-alive: Resuming paused audio');
                    audio.play().catch(e => console.log('Resume failed:', e));
                }
            }, 1000);
        }

        function stopKeepAlive() {
            if (keepAliveInterval) {
                clearInterval(keepAliveInterval);
                keepAliveInterval = null;
            }
        }

        // Override the play event to request wake lock
        const originalPlayCurrentSong = playCurrentSong;
        window.playCurrentSong = async function () {
            await originalPlayCurrentSong();
            requestWakeLock();
        };

        // Replace the function
        playCurrentSong = window.playCurrentSong;

        // Add wake lock to existing play event
        audio.addEventListener('play', () => requestWakeLock());
        audio.addEventListener('pause', () => releaseWakeLock());
        audio.addEventListener('play', () => startKeepAlive());
        audio.addEventListener('pause', () => stopKeepAlive());

        // Start keep-alive if already playing
        if (!audio.paused) {
            startKeepAlive();
        }

        // ============ MEDIA SESSION - LOCKSCREEN CONTROLS ============
        if ('mediaSession' in navigator) {
            navigator.mediaSession.setActionHandler('play', () => {
                playCurrentSong();
            });

            navigator.mediaSession.setActionHandler('pause', () => {
                pauseCurrentSong();
            });

            navigator.mediaSession.setActionHandler('previoustrack', () => {
                if (allSongs.length) {
                    let newIndex = currentSongIndex - 1;
                    if (newIndex < 0) newIndex = allSongs.length - 1;
                    loadSongToPlayer(newIndex, true);
                }
            });

            navigator.mediaSession.setActionHandler('nexttrack', () => {
                if (allSongs.length) {
                    let newIndex = currentSongIndex + 1;
                    if (newIndex >= allSongs.length) newIndex = 0;
                    loadSongToPlayer(newIndex, true);
                }
            });
        }

        // Update lockscreen info when song changes
        function updateLockscreenInfo(song) {
            if ('mediaSession' in navigator && song) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: song.title || 'Only-Beats',
                    artist: song.artist || 'BY - DHANANJAY PATIL',
                    album: song.album || currentFolder?.name || 'Only-Beats',
                    artwork: [
                        { src: song.cover_url || 'logo1.png', sizes: '512x512', type: 'image/png' }
                    ]
                });
            }
        }

        // Add lockscreen update to loadSongToPlayer
        const originalLoadSongToPlayer = loadSongToPlayer;
        window.loadSongToPlayer = function (index, playNow = false) {
            originalLoadSongToPlayer(index, playNow);
            if (allSongs[index]) {
                updateLockscreenInfo(allSongs[index]);
            }
        };
        loadSongToPlayer = window.loadSongToPlayer;

        // Add lockscreen update to ended event
        const originalEndedHandler = audio.endedListener || function () { };




        // ============ PREVENT AUDIO PAUSE ON APP SWITCH/BACKGROUND ============
        let keepAliveAudioContext = null;
        let keepAliveBuffer = null;
        let isBackgroundPlaybackEnabled = false;

        async function initKeepAliveAudio() {
            try {
                keepAliveAudioContext = new (window.AudioContext || window.webkitAudioContext)();
                const sampleRate = keepAliveAudioContext.sampleRate;
                keepAliveBuffer = keepAliveAudioContext.createBuffer(1, sampleRate * 0.1, sampleRate);
                const channelData = keepAliveBuffer.getChannelData(0);
                for (let i = 0; i < channelData.length; i++) {
                    channelData[i] = 0;
                }
                isBackgroundPlaybackEnabled = true;
                console.log('Keep-alive audio initialized');
            } catch (err) {
                console.log('AudioContext not supported:', err);
            }
        }

        function playSilentKeepAlive() {
            if (!keepAliveAudioContext || !keepAliveBuffer || keepAliveAudioContext.state === 'closed') {
                return;
            }
            if (keepAliveAudioContext.state === 'suspended') {
                keepAliveAudioContext.resume().catch(e => console.log('Resume error:', e));
            }
            const source = keepAliveAudioContext.createBufferSource();
            source.buffer = keepAliveBuffer;
            source.connect(keepAliveAudioContext.destination);
            source.start();
            source.onended = () => {
                source.disconnect();
            };
        }

        // Add silent audio when music plays
        let silentInterval = null;
        const originalPlayHandler = audio.play;

        audio.addEventListener('play', () => {
            if (!isBackgroundPlaybackEnabled && !audio.paused) {
                initKeepAliveAudio();
            }
            if (silentInterval) clearInterval(silentInterval);
            silentInterval = setInterval(() => {
                if (!audio.paused && audio.src && isBackgroundPlaybackEnabled) {
                    playSilentKeepAlive();
                }
            }, 15000);
        });

        audio.addEventListener('pause', () => {
            if (silentInterval) {
                clearInterval(silentInterval);
                silentInterval = null;
            }
        });

        audio.addEventListener('play', () => {
            updatePlayPauseIcons(true);
            if (currentFolder) {
                updateFolderPlayingState(currentFolder.id);
            }
            // Restart sync if lyrics are loaded and shown
            if (lyricsLoaded && lyricsShown && syncedLyricsData.length > 0) {
                startLyricsSync();
            }
        });

        audio.addEventListener('pause', () => {
            updatePlayPauseIcons(false);
            // Keep the folder highlighted even when paused
            // To remove highlight on pause, uncomment:
            // if (!currentPlayingSong) updateFolderPlayingState(null);
        });

        // Initialize on first user interaction
        document.addEventListener('click', function initAudioContext() {
            if (!isBackgroundPlaybackEnabled) {
                initKeepAliveAudio();
            }
        });

        // Also try to resume when page becomes visible again
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && !audio.paused && audio.src) {
                audio.play().catch(e => console.log('Visibility resume failed:', e));
            }
        });










        // ============ LYRICS FUNCTIONALITY ============
        const showLyricsBtn = document.getElementById('showLyricsBtn');
        const lyricsBtnText = document.getElementById('lyricsBtnText');
        const lyricsStatus = document.getElementById('lyricsStatus');
        const lyricsDisplay = document.getElementById('lyricsDisplay');
        const lyricsContent = document.getElementById('lyricsContent');

        async function fetchLyricsFromUrl(lyricsUrl) {
            try {
                console.log('Fetching lyrics from:', lyricsUrl);

                const response = await fetch(lyricsUrl);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                console.log('LRCLIB response:', data);

                // Check if we got results
                if (data && Array.isArray(data) && data.length > 0) {
                    // Return synced lyrics if available, otherwise plain lyrics
                    const bestMatch = data[0];
                    return {
                        synced: bestMatch.syncedLyrics || null,
                        plain: bestMatch.plainLyrics || null
                    };
                }

                return null;
            } catch (error) {
                console.error('Error fetching lyrics:', error);
                return null;
            }
        }
        // ============ SYNCED LYRICS PARSER ============
        function parseSyncedLyrics(syncedText) {
            if (!syncedText) return [];

            const lines = syncedText.split('\n');
            const parsed = [];

            // Regex to match [mm:ss.xx] or [mm:ss.xxx]
            const timeRegex = /\[(\d{2}):(\d{2}\.\d{2,3})\]\s*(.*)/;

            for (const line of lines) {
                const match = line.match(timeRegex);
                if (match) {
                    const minutes = parseInt(match[1]);
                    const seconds = parseFloat(match[2]);
                    const timeInSeconds = minutes * 60 + seconds;
                    const text = match[3].trim();
                    if (text) {
                        parsed.push({
                            time: timeInSeconds,
                            text: text
                        });
                    }
                }
            }

            return parsed;
        }

        function renderSyncedLyrics(parsedLyrics) {
            if (!parsedLyrics || parsedLyrics.length === 0) {
                lyricsContent.textContent = 'No synced lyrics available for this song.';
                return;
            }

            let html = '';
            for (let i = 0; i < parsedLyrics.length; i++) {
                const line = parsedLyrics[i];
                html += `<div class="lyrics-line" data-index="${i}" id="lyric-${i}">${escapeHtml(line.text)}</div>`;
            }

            lyricsContent.innerHTML = html;
            syncedLyricsData = parsedLyrics;
            currentLyricIndex = -1;
        }

        function updateLyricsHighlight(currentTime) {
            if (!syncedLyricsData || syncedLyricsData.length === 0) return;

            let activeIndex = -1;

            // Find the current line (last line with time <= currentTime)
            for (let i = 0; i < syncedLyricsData.length; i++) {
                if (syncedLyricsData[i].time <= currentTime) {
                    activeIndex = i;
                } else {
                    break;
                }
            }

            // Update highlights if changed
            if (activeIndex !== currentLyricIndex) {
                // Remove active class from all
                document.querySelectorAll('.lyrics-line').forEach(el => {
                    el.classList.remove('active');
                    el.classList.remove('passed');
                });

                // Add classes
                for (let i = 0; i < syncedLyricsData.length; i++) {
                    const el = document.getElementById(`lyric-${i}`);
                    if (!el) continue;

                    if (i < activeIndex) {
                        el.classList.add('passed');
                    } else if (i === activeIndex) {
                        el.classList.add('active');
                        // Scroll to active lyric
                        el.scrollIntoView({ block: 'center', behavior: 'smooth' });
                    }
                }

                currentLyricIndex = activeIndex;
            }
        }


        // ============ START LYRICS SYNC ============
        function startLyricsSync() {
            // Clear any existing interval
            if (lyricsSyncInterval) {
                clearInterval(lyricsSyncInterval);
                lyricsSyncInterval = null;
            }

            // Update immediately
            if (audio.currentTime !== undefined) {
                updateLyricsHighlight(audio.currentTime);
            }

            // Start interval for smooth updates
            lyricsSyncInterval = setInterval(() => {
                if (audio.currentTime !== undefined && !audio.paused) {
                    updateLyricsHighlight(audio.currentTime);
                }
            }, 200); // Update every 200ms for smooth highlighting
        }

        showLyricsBtn.addEventListener('click', async (e) => {
            e.stopPropagation();

            // Get current song - always use the one from modal
            let song = null;
            if (currentSongIndex >= 0 && allSongs[currentSongIndex]) {
                song = allSongs[currentSongIndex];
            } else if (currentPlayingSong && currentPlayingSong.title !== 'Only-Beats') {
                song = allSongs.find(s => s.url === currentPlayingSong.url);
                if (!song) song = currentPlayingSong;
            }

            if (!song) {
                lyricsStatus.textContent = 'No song is playing';
                lyricsStatus.style.color = '#ff6b6b';
                return;
            }

            // If lyrics display is visible and it's the same song, toggle hide
            if (lyricsDisplay.style.display === 'block' && lyricsContent.dataset.songId == song.id) {
                lyricsDisplay.style.display = 'none';
                lyricsBtnText.textContent = 'Show Lyrics';
                lyricsStatus.textContent = 'Click to fetch lyrics';
                lyricsStatus.style.color = '#888';
                lyricsShown = false;
                // Stop sync interval
                if (lyricsSyncInterval) {
                    clearInterval(lyricsSyncInterval);
                    lyricsSyncInterval = null;
                }
                return;
            }

            // If lyrics already loaded for this song, just show them
            if (lyricsLoaded && lyricsContent.dataset.songId == song.id) {
                lyricsDisplay.style.display = 'block';
                // Only re-render if not already rendered
                if (lyricsContent.children.length === 0 && syncedLyricsData.length > 0) {
                    renderSyncedLyrics(syncedLyricsData);
                }
                lyricsBtnText.textContent = 'Hide Lyrics';
                lyricsStatus.textContent = '✅ Lyrics found!';
                lyricsStatus.style.color = '#1DB954';
                lyricsShown = true;
                if (syncedLyricsData.length > 0) {
                    startLyricsSync();
                }
                return;
            }

            // Check if song has a lyrics URL
            if (!song.lyricsUrl) {
                lyricsContent.textContent = 'No lyrics URL provided for this song.';
                lyricsDisplay.style.display = 'block';
                lyricsBtnText.textContent = 'Hide Lyrics';
                lyricsStatus.textContent = '❌ No lyrics URL';
                lyricsStatus.style.color = '#ff6b6b';
                lyricsContent.dataset.songId = song.id;
                lyricsShown = true;
                return;
            }

            // Show loading state
            lyricsBtnText.textContent = 'Loading...';
            lyricsStatus.textContent = 'Fetching lyrics...';
            lyricsStatus.style.color = '#1DB954';
            lyricsContent.textContent = 'Loading lyrics...';
            lyricsDisplay.style.display = 'block';
            lyricsShown = true;
            lyricsContent.dataset.songId = song.id;

            // Fetch lyrics from the provided URL
            const result = await fetchLyricsFromUrl(song.lyricsUrl);

            if (result) {
                // Try synced lyrics first
                if (result.synced) {
                    const parsed = parseSyncedLyrics(result.synced);
                    if (parsed.length > 0) {
                        renderSyncedLyrics(parsed);
                        lyricsLoaded = true;
                        lyricsBtnText.textContent = 'Hide Lyrics';
                        lyricsStatus.textContent = '✅ Synced lyrics loaded!';
                        lyricsStatus.style.color = '#1DB954';
                        // Start sync
                        startLyricsSync();
                        return;
                    }
                }

                // Fallback to plain lyrics
                if (result.plain) {
                    lyricsContent.textContent = result.plain;
                    lyricsLoaded = true;
                    lyricsBtnText.textContent = 'Hide Lyrics';
                    lyricsStatus.textContent = '✅ Lyrics found!';
                    lyricsStatus.style.color = '#1DB954';
                    // Clear any sync
                    if (lyricsSyncInterval) {
                        clearInterval(lyricsSyncInterval);
                        lyricsSyncInterval = null;
                    }
                    return;
                }
            }

            // No lyrics found
            lyricsContent.textContent = 'Lyrics not found for this song.';
            lyricsBtnText.textContent = 'Hide Lyrics';
            lyricsStatus.textContent = '❌ Lyrics not available';
            lyricsStatus.style.color = '#ff6b6b';
            if (lyricsSyncInterval) {
                clearInterval(lyricsSyncInterval);
                lyricsSyncInterval = null;
            }
        });

        // ============ OPEN DOWNLOAD/ABOUT MODAL ============
        function openDownloadModal() {
            downloadModal.classList.add('active');
        }

        // ============ AUDIO FILE COUNTER ============
        const CACHE_KEY = 'audioCount';
        const CACHE_TIME_KEY = 'audioCountTime';
        const ONE_HOUR = 3600000; // 60 * 60 * 1000 ms

        async function getAudioCount(forceRefresh = false) {
            const cachedCount = localStorage.getItem(CACHE_KEY);
            const cachedTime = localStorage.getItem(CACHE_TIME_KEY);
            const now = Date.now();

            // Use cache if it's valid and we're not forcing a refresh
            if (!forceRefresh && cachedCount !== null && cachedTime !== null) {
                const elapsed = now - parseInt(cachedTime);
                if (elapsed < ONE_HOUR) {
                    document.getElementById('audioCount').textContent = cachedCount;
                    return; // ✅ Cache is fresh - no API call
                }
            }

            // Cache expired or forceRefresh = true - fetch from GitHub
            try {
                const response = await fetch(
                    'https://api.github.com/repos/only-beats/Forever-in-Sync/git/trees/main?recursive=1'
                );
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                const count = data.tree.length;

                // Update the display
                document.getElementById('audioCount').textContent = count;

                // Save to localStorage with the current timestamp
                localStorage.setItem(CACHE_KEY, count);
                localStorage.setItem(CACHE_TIME_KEY, now);
            } catch (error) {
                console.error('Error fetching audio count:', error);
                // Fallback to cached value if available
                const fallbackCount = localStorage.getItem(CACHE_KEY);
                if (fallbackCount !== null) {
                    document.getElementById('audioCount').textContent = fallbackCount;
                } else {
                    document.getElementById('audioCount').textContent = '?';
                }
            }
        }

        // Initial load - uses cache if less than 1 hour old
        getAudioCount();
        // Preload music note to avoid loading delay
        const preloadImg = new Image();
        preloadImg.src = 'svg/music-note.svg';
        // Set initial history state to "home" (folder grid)
        history.replaceState({ home: true }, '', window.location.href);



        // ============ VISUALIZER CONTROL ============
        const visualizer = document.getElementById('visualizerIcon');

        // Start hidden
        visualizer.style.opacity = '0';
        visualizer.style.transition = 'opacity 0.5s ease';

        audio.addEventListener('play', () => {
            visualizer.style.opacity = '1';
            visualizer.classList.add('playing');
        });

        audio.addEventListener('pause', () => {
            visualizer.style.opacity = '0';
            visualizer.classList.remove('playing');
        });

        audio.addEventListener('ended', () => {
            visualizer.style.opacity = '0';
            visualizer.classList.remove('playing');
        });



        // ─── SYSTEM BACK BUTTON SUPPORT ───
        window.addEventListener('hashchange', function () {
            const hash = window.location.hash;
            if (!hash || hash === '') {
                if (songsView.style.display === 'block' && currentFolder !== null) {
                    goBackToFolders();
                }
                return;
            }
            const folderName = decodeURIComponent(hash.substring(1));
            const folder = foldersList.find(f => f.name === folderName);
            if (folder && currentFolder !== folder) {
                openFolder(folder);
            }
        });

        window.addEventListener('popstate', function () {
            var hash = window.location.hash;
            if (!hash || hash === '') {
                if (songsView.style.display === 'block' && currentFolder !== null) {
                    goBackToFolders();
                }
                return;
            }
            var folderName = decodeURIComponent(hash.substring(1));
            var folder = foldersList.find(f => f.name === folderName);
            if (folder && currentFolder !== folder) {
                openFolder(folder);
            }
        });



        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful');
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
