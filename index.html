<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Only-Beats</title>
    <link rel="icon" href="logo1.png" type="image/x-icon">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            touch-action: pan-y pinch-zoom;
        }

        body {
            background: #050505;
            color: white;
            overflow: hidden;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #1DB954;
            border-radius: 10px;
            border-radius: 10px;
        }

        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .topbar {
            background: #050505;
            backdrop-filter: blur(20px);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            flex-shrink: 0;
            width: 100%;
        }

        .back-btn {
            background: rgba(29, 185, 84, 0.15);
            border: 1px solid #1DB954;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .back-btn img {
            width: 20px;
            height: 20px;
            filter: brightness(0) invert(1);
        }

        .back-btn:active {
            transform: scale(0.95);
            background: #1DB954;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-img {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            object-fit: cover;
            pointer-events: none;
            -webkit-user-drag: none;
        }

        .logo-text h2 {
            font-size: 20px;
            color: #1DB954;
            line-height: 1.2;
        }

        /* .logo-text p {
            font-size: 10px;
            color: #888;
        } */

        .refresh-btn {
            background: rgba(29, 185, 84, 0.15);
            border: 1px solid #1DB954;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .refresh-btn img {
            width: 20px;
            height: 20px;
            filter: brightness(0) invert(1);
        }

        .refresh-btn:active {
            transform: scale(0.95);
            background: #1DB954;
        }

        .refresh-btn.spinning img {
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .refresh-btn-desktop {
            display: none;
        }

        .refresh-btn-mobile {
            display: flex;
            margin-left: 8px;
        }

        .search {
            width: 280px;
            padding: 10px 18px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.05);
            outline: none;
            color: white;
            font-size: 14px;
            transition: 0.2s;
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
        }

        .search:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: #1DB954;
        }

        @media (min-width: 769px) {
            .refresh-btn-mobile {
                display: none;
            }

            .refresh-btn-desktop {
                display: flex;
                order: 3;
            }

            .search {
                order: 2;
                margin-left: auto;
                margin-right: 12px;
            }

            .logo {
                order: 1;
            }

            .back-btn {
                order: 0;
                margin-right: 12px;
            }
        }

        @media (max-width: 768px) {
            .topbar {
                flex-direction: row;
                flex-wrap: wrap;
                align-items: center;
                justify-content: space-between;
            }

            .logo {
                order: 1;
                flex: 1;
            }

            .search {
                order: 3;
                width: 100%;
                margin-top: 10px;
            }

            .refresh-btn-mobile {
                display: flex;
                order: 2;
                margin-left: auto;
            }

            .refresh-btn-desktop {
                display: none;
            }

            .back-btn {
                order: 0;
                margin-right: 8px;
            }
        }

        .main {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px 24px;
            padding-bottom: calc(115px + 140px);
            margin-top: 0;
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .title-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .sort-icons {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 16px;
            border-radius: 40px;
            margin-left: auto;
        }

        .title-left span {
            font-size: 18px;
            font-weight: 600;
            color: #1DB954;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .title-left span img {
            width: 20px;
            height: 20px;
            filter: brightness(0) invert(1);
        }

        .sort-icons img {
            width: 22px;
            height: 22px;
            cursor: pointer;
            transition: 0.2s;
            filter: brightness(0) invert(1);
            opacity: 0.6;
            padding: 2px;
        }

        .sort-icons img:active {
            opacity: 1;
            transform: scale(1.1);
        }

        .sort-icons img.active {
            opacity: 1;
            background: rgba(29, 185, 84, 0.3);
            border-radius: 50%;
        }



        /* Folder color variants based on ID */
        .folder-card[data-color="1"] {
            background: linear-gradient(135deg, rgba(0, 112, 243, 0.2), rgba(0, 112, 243, 0.05));
            border-color: rgba(0, 112, 243, 0.4);
        }

        .folder-card[data-color="1"] h4 {
            color: #3B82F6;
        }

        /* Folder color variables for pulse animation */
        .folder-card[data-color="1"].playing {
            --folder-color: #3B82F6;

            --folder-color-alpha: rgba(59, 130, 246, 0.5);
        }

        .folder-card[data-color="1"]:active {
            background: linear-gradient(135deg, rgba(0, 112, 243, 0.4), rgba(0, 112, 243, 0.2));
            border-color: #3B82F6;
        }




        .folder-card[data-color="2"] {
            background: linear-gradient(135deg, rgba(180, 130, 255, 0.2), rgba(180, 130, 255, 0.05));
            border-color: rgba(180, 130, 255, 0.4);
        }

        .folder-card[data-color="2"] h4 {
            color: #B482FF;
        }

        .folder-card[data-color="2"].playing {
            --folder-color: #B482FF;

            --folder-color-alpha: rgba(180, 130, 255, 0.5);
        }

            background: linear-gradient(135deg, rgba(180, 130, 255, 0.4), rgba(180, 130, 255, 0.2));
            border-color: #B482FF;
        }




        .folder-card[data-color="3"] {
            background: linear-gradient(135deg, rgba(255, 184, 0, 0.2), rgba(255, 184, 0, 0.05));
            border-color: rgba(255, 184, 0, 0.4);
        }

        .folder-card[data-color="3"] h4 {
            color: #FFB800;
        }

        .folder-card[data-color="3"].playing {
            --folder-color: #FFB800;
            --folder-color-bright: #FFD54F;
            --folder-color-alpha: rgba(255, 184, 0, 0.5);
        }

        .folder-card[data-color="3"]:active {
            background: linear-gradient(135deg, rgba(255, 184, 0, 0.4), rgba(255, 184, 0, 0.2));
            border-color: #FFB800;
        }




        .folder-card[data-color="4"] {
            background: linear-gradient(135deg, rgba(29, 185, 84, 0.2), rgba(29, 185, 84, 0.05));
            border-color: rgba(29, 185, 84, 0.4);
        }

        .folder-card[data-color="4"] h4 {
            color: #1DB954;
        }

        .folder-card[data-color="4"].playing {
            --folder-color: #1DB954;
            --folder-color-bright: #34D67A;
            --folder-color-alpha: rgba(29, 185, 84, 0.5);
        }

        .folder-card[data-color="4"]:active {
            background: linear-gradient(135deg, #1db95466, rgba(29, 185, 84, 0.2));
            border-color: #1DB954;
        }




        .folder-card[data-color="5"] {
            background: linear-gradient(135deg, rgba(156, 39, 176, 0.2), rgba(156, 39, 176, 0.05));
            border-color: rgba(156, 39, 176, 0.4);
        }

        .folder-card[data-color="5"] h4 {
            color: #9C27B0;
        }

        .folder-card[data-color="5"].playing {
            --folder-color: #9C27B0;
            --folder-color-bright: #B85CC8;
            --folder-color-alpha: rgba(156, 39, 176, 0.5);
        }

        .folder-card[data-color="5"]:active {
            background: linear-gradient(135deg, rgba(156, 39, 176, 0.4), rgba(156, 39, 176, 0.2));
            border-color: #9C27B0;
        }



        .folder-card[data-color="6"] {
            background: linear-gradient(135deg, rgba(0, 188, 212, 0.2), rgba(0, 188, 212, 0.05));
            border-color: rgba(0, 188, 212, 0.4);
        }

        .folder-card[data-color="6"] h4 {
            color: #00BCD4;
        }

        .folder-card[data-color="6"]:active {
            background: linear-gradient(135deg, rgba(0, 188, 212, 0.4), rgba(0, 188, 212, 0.2));
            border-color: #00BCD4;
        }

        .folder-card[data-color="6"].playing {
            --folder-color: #00BCD4;
            --folder-color-bright: #4DD0E1;
            --folder-color-alpha: rgba(0, 188, 212, 0.5);
        }



        .folder-card[data-color="7"] {
            background: linear-gradient(135deg, rgba(233, 30, 99, 0.2), rgba(233, 30, 99, 0.05));
            border-color: rgba(233, 30, 99, 0.4);
        }

        .folder-card[data-color="7"] h4 {
            color: #E91E63;
        }

        .folder-card[data-color="7"]:active {
            background: linear-gradient(135deg, rgba(233, 30, 99, 0.4), rgba(233, 30, 99, 0.2));
            border-color: #E91E63;
        }

        .folder-card[data-color="7"].playing {
            --folder-color: #E91E63;
            --folder-color-bright: #F06292;
            --folder-color-alpha: rgba(233, 30, 99, 0.5);
        }




        .folder-card[data-color="8"] {
            background: linear-gradient(135deg, rgba(255, 87, 34, 0.2), rgba(255, 87, 34, 0.05));
            border-color: rgba(255, 87, 34, 0.4);
        }

        .folder-card[data-color="8"] h4 {
            color: #FF5722;
        }

        .folder-card[data-color="8"].playing {
            --folder-color: #FF5722;
            --folder-color-bright: #FF8A65;
            --folder-color-alpha: rgba(255, 87, 34, 0.5);
        }

        .folder-card[data-color="8"]:active {
            background: linear-gradient(135deg, rgba(255, 87, 34, 0.4), rgba(255, 87, 34, 0.2));
            border-color: #FF5722;
        }



        .folder-card[data-color="9"] {
            background: linear-gradient(135deg, rgba(0, 150, 136, 0.2), rgba(0, 150, 136, 0.05));
            border-color: rgba(0, 150, 136, 0.4);
        }

        .folder-card[data-color="9"] h4 {
            color: #009688;
        }

        .folder-card[data-color="9"]:active {
            background: linear-gradient(135deg, rgba(0, 150, 136, 0.4), rgba(0, 150, 136, 0.2));
            border-color: #009688;
        }

        .folder-card[data-color="9"].playing {
            --folder-color: #009688;
            --folder-color-bright: #26A69A;
            --folder-color-alpha: rgba(0, 150, 136, 0.5);
        }



        .folder-card[data-color="10"] {
            background: linear-gradient(135deg, rgba(0, 150, 136, 0.2), rgba(0, 150, 136, 0.05));
            border-color: rgba(0, 150, 136, 0.4);
        }

        .folder-card[data-color="10"] h4 {
            color: #009688;
        }

        .folder-card[data-color="10"]:active {
            background: linear-gradient(135deg, rgba(0, 150, 136, 0.4), rgba(0, 150, 136, 0.2));
            border-color: #009688;
        }

        .folder-card[data-color="10"].playing {
            --folder-color: #009688;
            --folder-color-bright: #26A69A;
            --folder-color-alpha: rgba(0, 150, 136, 0.5);
        }


        .folder-card[data-color="11"] {
            background: linear-gradient(135deg, rgba(156, 39, 176, 0.2), rgba(156, 39, 176, 0.05));
            border-color: rgba(156, 39, 176, 0.4);
        }

        .folder-card[data-color="11"] h4 {
            color: #9C27B0;
        }

        .folder-card[data-color="11"].playing {
            --folder-color: #9C27B0;
            --folder-color-bright: #B85CC8;
            --folder-color-alpha: rgba(156, 39, 176, 0.5);
        }

        .folder-card[data-color="11"]:active {
            background: linear-gradient(135deg, rgba(156, 39, 176, 0.4), rgba(156, 39, 176, 0.2));
            border-color: #9C27B0;
        }



        /* Playing folder - cycling dotted border */
        @keyframes cycleBorder {
            0% {
                border-color: var(--folder-color);
            }

            33% {
                border-color: var(--folder-color-bright);
            }

            66% {
                border-color: var(--folder-color);
            }

            100% {
                border-color: var(--folder-color);
            }
        }

        .folder-card.playing {
            animation: cycleBorder 1.5s ease-in-out infinite;
            border-width: 3px;
            border-style: dashed;
            border-radius: 20px;
            box-shadow: none !important;
        }


        .folder-card:active {
            transform: scale(0.96);
        }


        .folder-card:active {
            transform: scale(0.96);
            background: rgba(29, 185, 84, 0.15);
            border-color: #1DB954;
        }

        .folders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            margin-top: 10px;
        }

        /* Fixed size folder cards - all boxes will be identical dimensions */
        .folder-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.05);
            /* FIXED SIZE - all cards exactly same dimensions */
            width: 100%;
            height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Ensure consistent image size */
        /* Ensure consistent image size - INCREASED SIZE */
        .folder-card img {
            width: 85px;
            height: 85px;
            object-fit: contain;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        /* Text container with fixed height and ellipsis for long names */
        .folder-card h4 {
            font-size: 14px;
            font-weight: 500;
            color: #1DB954;
            margin-top: 8px;
            text-align: center;
            /* Fixed height for text area - prevents card from resizing */
            width: 100%;
            max-height: 40px;
            overflow: hidden;
            text-overflow: ellipsis;
            -webkit-box-orient: vertical;
            line-height: 1.3;
            word-break: break-word;
        }

        .search-results-header {
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .search-results-header h3 {
            font-size: 16px;
            color: #1DB954;
        }

        .songs-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .song-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            transition: all 0.2s ease;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .song-row.active {
            background: rgba(29, 185, 84, 0.15);
            border-color: rgba(29, 185, 84, 0.3);
        }



        .track-number {
            width: 30px;
            font-size: 13px;
            font-weight: 500;
            color: #888;
            text-align: right;
            flex-shrink: 0;
        }

        .song-cover {
            width: 56px;
            height: 56px;
            border-radius: 4px;
            object-fit: cover;
            pointer-events: none;
            -webkit-user-drag: none;
            flex-shrink: 0;
        }

        .song-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        .song-details {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
            overflow: hidden;
        }

        .song-title {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-artist {
            font-size: 11px;
            color: #999;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .folder-badge {
            font-size: 10px;
            color: #1DB954;
            background: rgba(29, 185, 84, 0.15);
            padding: 2px 8px;
            border-radius: 20px;
            margin-left: 8px;
        }

        .player {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(8, 8, 8, 0.98);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px 20px;
            z-index: 100;
            flex-shrink: 0;
        }

        .player-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: nowrap;
        }

        .current-song {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 280px;
            min-width: 280px;
            max-width: 280px;
            cursor: pointer;
            padding: 4px 8px;
            transition: 0.2s;
            overflow: hidden;
            position: relative;
        }

        .current-song .song-info {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            padding-right: 36px;
            /* Space for the icon */
        }

        .current-song .song-info h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 2px;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .current-song .song-info p {
            font-size: 11px;
            color: #1DB954;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }


        .current-song:hover .click-indicator {
            opacity: 1;
        }



        .current-song .click-indicator {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 1;
            z-index: 10;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 60px;
            /* Keep height for proper centering */
            line-height: 1px;
        }

        .current-song .click-indicator img {
            border: none;
            outline: none;
            background: transparent;
            display: block;
            object-fit: contain;
        }

        .current-song .click-indicator #indicatorIcon {
            transition: none;
        }


        .current-song img {
            width: 48px;
            height: 48px;
            object-fit: cover;
            pointer-events: none;
            -webkit-user-drag: none;
            flex-shrink: 0;
        }

        .song-info {
            flex: 1;
            min-width: 0;
            overflow: hidden;
        }

        .song-info h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 2px;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-info p {
            font-size: 11px;
            color: #1DB954;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .controls {
            flex: 1;
            min-width: 300px;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .buttons {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .buttons button {
            background: none;
            border: none;
            cursor: pointer;
            transition: 0.15s;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            flex-shrink: 0;
        }

        .buttons button img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: brightness(0) invert(1);
        }

        .main-play {
            background: #1DB954 !important;
            box-shadow: 0 4px 12px rgba(29, 185, 84, 0.3);
        }

        .main-play img {
            filter: brightness(0) !important;
        }

        .progress {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .progress span {
            font-size: 11px;
            color: #aaa;
            min-width: 35px;
            text-align: center;
        }

        .progress input {
            flex: 1;
            height: 4px;
            border-radius: 10px;
            accent-color: #1DB954;
            cursor: pointer;

    <div id="downloadModal" class="download-modal-overlay">
        <div class="download-modal-card" style="text-align: center;">
            <!-- Logo + Name -->
            <div
                style="display: flex; align-items: left; justify-content: left; gap: 14px; margin-bottom: 20px; margin-left: 18px;">
                <!-- Logo on the left -->
                <img src="logo1.png" alt="Only-Beats"
                    style="width: 50px; height: 50px; border-radius: 12px; object-fit: cover; flex-shrink: 0;">

                <!-- Text block on the right -->
                <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 1px;">
                    <h2 style="color: #1DB954; font-size: 22px; font-weight: 700; margin: 0; line-height: 1.2;">
                        Only-Beats</h2>
                    <p style="color: #1DB954; font-size: 12px; font-weight: 500; margin: 0; letter-spacing: 0.3px;">BY -
                        DHANANJAY PATIL</p>
                </div>
            </div>
            <!-- Close Button -->
            <button class="close-btn" id="closeDownloadModalBtn"
                style="margin-top: 12px; background: #1DB954; border: none; padding: 10px 20px; border-radius: 40px; font-weight: 600; cursor: pointer; color: black; width: 100%; font-size: 14px;">CLOSE</button>
        </div>
    </div>

    <div id="toastMsg" class="toast-msg"></div>

    <audio id="audioPlayer"></audio>

    <script>


        // ============ APP STATE ============
        let audio = document.getElementById('audioPlayer');
        let currentFolder = null;
        let foldersList = [];
        let allSongsWithFolder = [];
        // Synced lyrics variables
        let syncedLyricsData = [];
        let currentLyricIndex = -1;
        let lyricsSyncInterval = null;

        // Store current playing song info
        let currentPlayingSong = null;
        let wasPlayingBeforeFolderChange = false;
        let isPlayingNext = false;
        // Lyrics state variables
        let lyricsLoaded = false;
        let lyricsShown = false;

        // Preload variables
        let preloadedBlobUrl = null;         // object URL of the preloaded next song
        let preloadedSongIndex = -1;         // index of the song for which we have a blob
        let preloadFetchInProgress = false;  // prevent multiple simultaneous fetches



        const LIKED_STORAGE_KEY = 'onlyBeatsLikedSongs';

        function getLikedSongs() {
            try {
                return JSON.parse(localStorage.getItem(LIKED_STORAGE_KEY)) || [];
            } catch {
                return [];
            }
        }

        function saveLikedSongs(songs) {
            localStorage.setItem(LIKED_STORAGE_KEY, JSON.stringify(songs));
        }

        function isSongLiked(song) {
            const liked = getLikedSongs();
            return liked.some(s => s.url === song.url);
        }

        function toggleLike(song) {
            let liked = getLikedSongs();
            const existingIndex = liked.findIndex(s => s.url === song.url);
            if (existingIndex !== -1) {
                liked.splice(existingIndex, 1);
            } else {
                // Store enough data to display and play later
                liked.push({
                    title: song.title,
                    artist: song.artist,
                    album: song.album || '',
                    cover_url: song.cover_url || 'logo1.png',
                    url: song.url,
                    lyricsUrl: song.lyricsUrl || '',   // ✅ ADD THIS
                    // optionally store folder info
                    likedAt: Date.now()
                });
            }
            saveLikedSongs(liked);
            return existingIndex === -1; // true if liked, false if unliked
        }

        // --- Helper to return SVG <img> for like status ---
        function getLikeIcon(liked) {
            const src = liked ? 'svg/Liked.svg' : 'svg/Disliked.svg';
            return `<img src="${src}" alt="like" style="width: 13px; height: 13px; display:block;">`;
        }

        // ============ SONG FILE CACHE ============
        const songFileCache = new Map();  // Stores the raw text content of each folderX.js

        async function fetchSongFile(url) {
            // If we already have it, return it instantly
            if (songFileCache.has(url)) {
                return songFileCache.get(url);
            }
            // Otherwise fetch and store
            const response = await fetch(url + '?t=' + Date.now());
            const text = await response.text();
            songFileCache.set(url, text);
            return text;
        }

        // Website URL
        const DOWNLOAD_WEBSITE_URL = "https://only-beats.github.io/only-beats/";

        const foldersView = document.getElementById('foldersView');
        const songsView = document.getElementById('songsView');
        const searchResultsView = document.getElementById('searchResultsView');
        const backBtn = document.getElementById('backBtn');
        const currentFolderName = document.getElementById('currentFolderName');
        const songsContainer = document.getElementById('songsList');
        const searchResultsList = document.getElementById('searchResultsList');
        const searchInput = document.getElementById('searchInput');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const sortAZBtn = document.getElementById('sortAZ');
        const sortZABtn = document.getElementById('sortZA');
        const sortRecentBtn = document.getElementById('sortRecent');
        let currentSort = 'recent';

        // Download Modal Elements
        const downloadModal = document.getElementById('downloadModal');
        const closeDownloadModalBtn = document.getElementById('closeDownloadModalBtn');
        //  const copyLinkBtn = document.getElementById('copyLinkBtn');

        function refreshApp(btnElement) {
            btnElement.classList.add('spinning');
            showToast('Updating...', 1500);

            setTimeout(() => window.location.reload(), 500);
        }

        document.getElementById('refreshBtnMobile')?.addEventListener('click', (e) => refreshApp(e.currentTarget));
        document.getElementById('refreshBtnDesktop')?.addEventListener('click', (e) => refreshApp(e.currentTarget));

        function showToast(msg, duration = 2000) {
            const toast = document.getElementById('toastMsg');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), duration);
        }
        function showDownloadModal() {
            downloadModal.classList.add('active');
        }

        function hideDownloadModal() {
            downloadModal.classList.remove('active');
        }


        // Close modal when clicking close button
        closeDownloadModalBtn.addEventListener('click', hideDownloadModal);

        // Close modal when clicking outside
        downloadModal.addEventListener('click', (e) => {
            if (e.target === downloadModal) {
                hideDownloadModal();
            }
        });


        // ============ LOAD FOLDERS ============
        async function loadFolders() {
            try {
                const script = document.createElement('script');
                script.src = 'folders.js';
                script.onload = () => {
                    if (typeof FOLDERS_DATABASE !== 'undefined') {
                        foldersList = FOLDERS_DATABASE;
                        // 🔽 INJECT LIKED FOLDER HERE 🔽
                        const likedFolder = {
                            id: 0,
                            name: "Liked Songs",
                            songsFile: null,
                            folderCover: "svg/HeartLike.svg", // ensure this SVG exists or use emoji  Heart.svg
                            isLikedFolder: true
                        };
                        foldersList.unshift(likedFolder); // adds it as the first folder
                        renderFolders(foldersList);
                        // Re-attempt folder opening from hash after folders are rendered
                        setTimeout(function () {
                            const hash = window.location.hash;
                            if (hash && hash !== '#') {
                                const folderName = decodeURIComponent(hash.substring(1));
                                const folder = foldersList.find(f => f.name === folderName);
                                if (folder) {
                                    // ✅ If it's the liked folder and empty, clear hash and show toast
                                    if (folder.isLikedFolder && getLikedSongs().length === 0) {
                                        window.location.hash = '';
                                        showToast('No liked songs yet', 2500);
                                        goBackToFolders();
                                        return;
                                    }
                                    openFolder(folder);
                                }
                            }
                        }, 100);
                        setTimeout(tryOpenFolderFromHash, 100);
                        setTimeout(updateIndicatorIcon, 100);

                        // ─── HASH POLLING FALLBACK (for mobile) ───
                        function tryOpenFolderFromHash() {
                            const hash = window.location.hash;
                            if (hash && hash !== '#') {
                                const folderName = decodeURIComponent(hash.substring(1));
                                const folder = foldersList.find(f => f.name === folderName);
                                if (folder) {
                                    openFolder(folder);
                                    return true; // Folder opened successfully
                                }
                            }
                            return false;
                        }

                        // Try once immediately
                        let folderOpened = tryOpenFolderFromHash();

                        // If not opened, start polling (checks every 200ms for up to 3 seconds)
                        if (!folderOpened) {
                            let attempts = 0;
                            const maxAttempts = 60; // 60 * 200ms = 12 seconds (enough for mobile)
                            const pollInterval = setInterval(() => {
                                attempts++;
                                if (tryOpenFolderFromHash()) {
                                    clearInterval(pollInterval);
                                } else if (attempts >= maxAttempts) {
                                    clearInterval(pollInterval);
                                    // If still not opened after 12s, try one last time (folders may have loaded late)
                                    setTimeout(tryOpenFolderFromHash, 500);
                                }
                            }, 200);
                        }

                        // ⏳ Build search index in the BACKGROUND
                        if ('requestIdleCallback' in window) {
                            requestIdleCallback(() => buildSearchIndex());
                        } else {
                            setTimeout(() => buildSearchIndex(), 100);
                        }
                    }
                };
                script.onerror = () => {
                    foldersView.innerHTML = '<div style="text-align:center; padding:40px;">Error loading folders. Please check folders.js file.</div>';
                };
                document.head.appendChild(script);
            } catch (e) {
                console.error('Error loading folders:', e);
                foldersView.innerHTML = '<div style="text-align:center; padding:40px;">Error loading folders</div>';
            }
        }

        // Restore folder view from sessionStorage (name-based)
        const savedFolderName = sessionStorage.getItem('currentFolderName');
        // Only restore from sessionStorage if there's no hash in the URL
        if (savedFolderName && !window.location.hash) {
            const checkFolders = setInterval(() => {
                if (foldersList.length > 0) {
                    clearInterval(checkFolders);
                    const folder = foldersList.find(f => f.name === savedFolderName);
                    if (folder) {
                        openFolder(folder);
                    } else {
                        sessionStorage.removeItem('currentFolderName');
                    }
                }
            }, 100);
        }


        async function buildSearchIndex() {
            allSongsWithFolder = [];

            for (const folder of foldersList) {
                try {
                    const fileContent = await fetchSongFile(folder.songsFile);

                    const cleanScope = {};
                    const executeInCleanScope = new Function('window', 'scope', `
                try {
                    ${fileContent}
                    if (typeof SONGS_DATABASE !== 'undefined') {
                        scope.songsData = SONGS_DATABASE;
                    }
                } catch(e) {
                    console.error('Error evaluating script:', e);
                }
            `);

                    executeInCleanScope(window, cleanScope);

                    if (cleanScope.songsData && Array.isArray(cleanScope.songsData) && cleanScope.songsData.length > 0) {
                        const songsWithFolder = cleanScope.songsData.map((song, index) => ({
                            ...song,
                            id: song.id || index,
                            album: song.album || folder.name,
                            cover_url: song.cover || 'logo1.png',
                            folderName: folder.name,
                            folderId: folder.id  // IMPORTANT: Store folder ID
                        }));
                        allSongsWithFolder.push(...songsWithFolder);
                    }

                } catch (e) {
                    console.error(`Failed to load ${folder.songsFile}:`, e);
                }
            }
        }

        function renderFolders(folders) {
            foldersView.innerHTML = '';
            folders.forEach(folder => {
                const folderCard = document.createElement('div');
                folderCard.className = 'folder-card';
                let colorId;
                if (folder.isLikedFolder) {
                    colorId = 4; // ✅ Use green color scheme (same as data-color="4")
                } else {
                    colorId = ((folder.id - 1) % 10) + 1;
                }
                folderCard.setAttribute('data-color', colorId);

                // Store folder reference
                folderCard._folder = folder;

                const folderImage = folder.folderCover || 'svg/folder.svg';

                folderCard.innerHTML = `
            <img src="${folderImage}" alt="${folder.name}" onerror="this.src='svg/folder.svg'">
            <h4>${escapeHtml(folder.name)}</h4>
        `;
                folderCard.addEventListener('click', () => openFolder(folder));
                foldersView.appendChild(folderCard);
            });
        }

        // Track which folder is currently playing
        let activeFolderId = null;

        function updateFolderPlayingState(folderId) {
            // Remove playing class from all folders
            document.querySelectorAll('.folder-card').forEach(card => {
                card.classList.remove('playing');
            });

            // If folderId is provided and exists, add playing class
            if (folderId !== null) {
                const cards = document.querySelectorAll('.folder-card');
                cards.forEach(card => {
                    if (card._folder && card._folder.id === folderId) {
                        card.classList.add('playing');
                        activeFolderId = folderId;
                    }
                });
            } else {
                activeFolderId = null;
            }
        }
        // ============ OPEN FOLDER - PRESERVE PLAYBACK ============
        async function openFolder(folder, updateHash = true, customHash = null) {
            // Update folder playing state
            updateFolderPlayingState(folder.id);
            const wasPlaying = !audio.paused && audio.src && audio.currentTime > 0;
            const savedCurrentTime = audio.currentTime;
            const savedSongUrl = audio.src;
            const savedSongTitle = document.getElementById('playerTitle').innerText;
            const savedSongArtist = document.getElementById('playerArtist').innerText;
            const savedSongCover = document.getElementById('playerCover').src;
            console.log('Liked folder opened, liked songs:', getLikedSongs());
            console.log('localStorage item:', localStorage.getItem(LIKED_STORAGE_KEY));

            if (wasPlaying && savedSongUrl && savedSongUrl !== '') {
                wasPlayingBeforeFolderChange = true;
                currentPlayingSong = {
                    url: savedSongUrl,
                    title: savedSongTitle,
                    artist: savedSongArtist,
                    cover: savedSongCover,
                    currentTime: savedCurrentTime
                };
                audio.pause();
            } else {
                wasPlayingBeforeFolderChange = false;
                currentPlayingSong = null;
            }

            currentFolder = folder;
            // If this is the special "Liked Songs" folder, load from localStorage
            if (folder.isLikedFolder) {
                // Prepare the view
                foldersView.style.display = 'none';
                songsView.style.display = 'block';
                backBtn.style.display = 'flex';
                const likedCount = getLikedSongs().length;
                currentFolderName.innerHTML = `${folder.name} <span style="font-size:0.7em; color:#999; position:relative; top:3px;">(${likedCount})</span>`;
                history.pushState(null, '', '#' + encodeURIComponent(folder.name));

                // Get liked songs synchronously from localStorage
                // Get liked songs synchronously from localStorage
                let likedSongs = getLikedSongs();
                let updated = false;

                // Auto-fill missing lyricsUrl from the global search index
                likedSongs = likedSongs.map(song => {
                    if (!song.lyricsUrl && allSongsWithFolder.length > 0) {
                        const original = allSongsWithFolder.find(s => s.url === song.url);
                        if (original && original.lyricsUrl) {
                            song.lyricsUrl = original.lyricsUrl;
                            updated = true;
                        }
                    }
                    return song;
                });

                // If we updated any, save back to localStorage
                if (updated) {
                    saveLikedSongs(likedSongs);
                }

                allSongs = likedSongs.map((song, index) => ({
                    ...song,
                    id: song.id || index,
                    album: song.album || folder.name,
                    cover_url: song.cover_url || 'logo1.png',
                    lyricsUrl: song.lyricsUrl || ''
                }));
                currentSongIndex = -1; // reset

                if (allSongs.length === 0) {
                    // Show empty state immediately
                    songsContainer.innerHTML = `
            <div style="text-align:center; padding:40px; color:#888;">
                <img src="svg/NoLiked1.svg" alt="No liked songs" style="width: 59px; height: 59px; display:block; margin:0 auto 16px;">
                <div style="font-size:18px; color:#1DB954; font-weight:600;">No liked songs yet</div>
                <div style="font-size:14px; margin-top:8px;">Start liking songs and they’ll appear here</div>
            </div>
        `;
                } else {
                    renderSongs(allSongs, false);
                }

                return; // stop further execution
            }

            sessionStorage.setItem('currentFolderName', folder.name);   // ✅ new

            // showToast(`Loading ${folder.name}...`, 800);

            searchResultsView.style.display = 'none';

            try {
                allSongs = [];
                currentSongIndex = -1;
                renderSongs([], false);

                foldersView.style.display = 'none';
                songsView.style.display = 'block';
                backBtn.style.display = 'flex';
                currentFolderName.innerText = folder.name;

                // 🔼 Push a state so system back works
                // Update URL using pushState (works on mobile)
                var folderHash = encodeURIComponent(folder.name);
                try {
                    history.pushState(null, '', '#' + folderHash);
                } catch (e) {
                    window.location.hash = folderHash;
                }
                // Force refresh of address bar on mobile
                setTimeout(function () {
                    if (window.location.hash !== '#' + folderHash) {
                        window.location.hash = folderHash;
                    }
                }, 10);
                const fileContent = await fetchSongFile(folder.songsFile);

                const cleanScope = {};
                const executeInCleanScope = new Function('window', 'scope', `
                    try {
                        ${fileContent}
                        if (typeof SONGS_DATABASE !== 'undefined') {
                            scope.songsData = SONGS_DATABASE;
                        }
                    } catch(e) {
                        console.error('Error evaluating script:', e);
                    }
                `);

                executeInCleanScope(window, cleanScope);

                if (cleanScope.songsData && Array.isArray(cleanScope.songsData) && cleanScope.songsData.length > 0) {
                    allSongs = cleanScope.songsData.map((song, index) => ({
                        ...song,
                        id: song.id || index,
                        album: song.album || folder.name,
                        cover_url: song.cover || 'logo1.png'
                    }));
                    allSongs.sort((a, b) => (b.id || 0) - (a.id || 0));
                    renderSongs(allSongs, false);
                    showToast(`${allSongs.length} songs loaded`, 2200);
                } else {
                    allSongs = [];
                    renderSongs([], false);
                    showToast(`${folder.name}\nNo songs found`, 1500);
                }

                if (wasPlayingBeforeFolderChange && currentPlayingSong && currentPlayingSong.url) {
                    audio.src = currentPlayingSong.url;
                    audio.currentTime = currentPlayingSong.currentTime || 0;
                    audio.play().then(() => {
                        updatePlayPauseIcons(true);
                        document.getElementById('playerTitle').innerText = currentPlayingSong.title;
                        document.getElementById('playerArtist').innerText = currentPlayingSong.artist;
                        document.getElementById('playerCover').src = currentPlayingSong.cover;
                        updateIndicatorIcon(); // Add this line
                    }).catch(e => console.log("Playback restore failed:", e));
                } else {
                    document.getElementById('playerTitle').innerText = 'Only-Beats';
                    document.getElementById('playerArtist').innerText = 'BY - DHANANJAY PATIL';
                    document.getElementById('playerCover').src = 'logo1.png';
                    updatePlayPauseIcons(false);
                    updateIndicatorIcon(); // Add this line

                }

            } catch (e) {
                console.error('Error loading folder:', e);
                allSongs = [];
                renderSongs([], false);
                showToast(`${folder.name}\nError loading`, 1500);

                if (wasPlayingBeforeFolderChange && currentPlayingSong && currentPlayingSong.url) {
                    audio.src = currentPlayingSong.url;
                    audio.currentTime = currentPlayingSong.currentTime || 0;
                    audio.play().catch(() => { });
                }
            }
        }

        function goBackToFolders() {
            foldersView.style.display = 'grid';
            songsView.style.display = 'none';
            searchResultsView.style.display = 'none';
            backBtn.style.display = 'none';
            currentFolder = null;

            searchInput.value = '';
            // Update the player display
            if (currentSongIndex >= 0 && allSongs[currentSongIndex]) {
                const song = allSongs[currentSongIndex];
                document.getElementById('playerTitle').innerText = song.title;
                document.getElementById('playerArtist').innerText = song.artist;
                document.getElementById('playerCover').src = song.cover_url || 'logo1.png';
            } else if (currentPlayingSong) {
                document.getElementById('playerTitle').innerText = currentPlayingSong.title;
                document.getElementById('playerArtist').innerText = currentPlayingSong.artist;
                document.getElementById('playerCover').src = currentPlayingSong.cover || 'logo1.png';
            } else {
                // 👇 No song is loaded – reset to default
                document.getElementById('playerTitle').innerText = 'Only-Beats';
                document.getElementById('playerArtist').innerText = 'BY - DHANANJAY PATIL';
                document.getElementById('playerCover').src = 'logo1.png';
            }
            updateIndicatorIcon(); // This will now show the Download APP icon
            window.location.hash = '';  // Clear the hash
            sessionStorage.removeItem('currentFolderName');

        }

        backBtn.addEventListener('click', goBackToFolders);

        // ============ GLOBAL SEARCH ============
        function performGlobalSearch() {
            const query = searchInput.value.toLowerCase().trim();

            if (query === '') {
                if (!currentFolder) {
                    foldersView.style.display = 'grid';
                    songsView.style.display = 'none';
                    searchResultsView.style.display = 'none';
                } else {
                    foldersView.style.display = 'none';
                    songsView.style.display = 'block';
                    searchResultsView.style.display = 'none';
                }
                return;
            }

            const results = allSongsWithFolder.filter(song =>
                song.title.toLowerCase().includes(query) ||
                song.artist.toLowerCase().includes(query)
            );

            foldersView.style.display = 'none';
            songsView.style.display = 'none';
            searchResultsView.style.display = 'block';

            renderSearchResults(results);
        }

        function renderSearchResults(results) {
            searchResultsList.innerHTML = "";
            if (results.length === 0) {
                searchResultsList.innerHTML = '<div style="text-align:center; padding:40px;">No songs found.</div>';
                return;
            }

            results.forEach((song, idx) => {
                const row = document.createElement('div');
                row.className = 'song-row';
                row.dataset.songId = song.id;

                row.innerHTML = `
    <div class="song-left">
        <div class="track-number">${(idx + 1).toString().padStart(2, '0')}</div>
        <img class="song-cover search-cover" src="${song.cover_url || 'logo1.png'}" onerror="this.src='logo1.png'">
        <div class="song-details">
            <div class="song-title">${escapeHtml(song.title)}</div>
            <div class="song-artist">${escapeHtml(song.artist)}</div>
            <div class="folder-badge-wrapper">
                <img src="svg/list-music.svg" class="folder-icon" alt="folder">

        // Preload controller for aborting stale fetches
        let preloadController = null;

        function preloadNextSong() {
            // Only preload if we have a valid playlist and index
            if (allSongs.length === 0 || currentSongIndex === undefined || currentSongIndex < 0) return;

            // Don't preload on slow networks (saves data)
            if (navigator.connection) {
                const conn = navigator.connection;
                if (conn.effectiveType === 'slow-2g' || conn.effectiveType === '2g' || conn.saveData) {
                    return; // skip preload to save data
                }
            }

            let nextIndex = currentSongIndex + 1;
            if (nextIndex >= allSongs.length) nextIndex = 0;

            // If we already have a valid preload for this exact song, do nothing
            if (preloadedSongIndex === nextIndex && preloadedBlobUrl) return;

            // Cancel any ongoing preload fetch
            if (preloadController) {
                preloadController.abort();
                preloadController = null;
            }

            // Revoke any stale blob
            if (preloadedBlobUrl) {
                URL.revokeObjectURL(preloadedBlobUrl);
                preloadedBlobUrl = null;
                preloadedSongIndex = -1;
            }

            const nextSong = allSongs[nextIndex];
            if (!nextSong || !nextSong.url) return;

            // Create a new AbortController for this fetch
            preloadController = new AbortController();
            const signal = preloadController.signal;

            preloadFetchInProgress = true;

            fetch(nextSong.url, {
                cache: 'no-store',      // ✅ Don't store on disk, use memory only
                signal: signal
            })
                .then(res => {
                    if (!res.ok) throw new Error('Fetch failed');
                    return res.blob();
                })
                .then(blob => {
                    // If the fetch was aborted or we've already cleared, clean up
                    if (signal.aborted) {
                        preloadFetchInProgress = false;
                        return;
                    }

                    // Revoke any previous blob (should already be null, but safety)
                    if (preloadedBlobUrl) {
                        URL.revokeObjectURL(preloadedBlobUrl);
                        preloadedBlobUrl = null;
                    }

                    preloadedBlobUrl = URL.createObjectURL(blob);
                    preloadedSongIndex = nextIndex;
                    preloadFetchInProgress = false;
                    preloadController = null; // fetch is done, release controller

                    console.log(`✅ Preloaded: ${nextSong.title} (${(blob.size / 1024 / 1024).toFixed(2)} MB)`);
                })
                .catch(err => {
                    // Ignore AbortError – it's expected
                    if (err.name === 'AbortError') {
                        console.log('⏹️ Preload aborted');
                    } else {
                        console.warn('⚠️ Preload failed:', err);
                    }
                    preloadFetchInProgress = false;
                    preloadedBlobUrl = null;
                    preloadedSongIndex = -1;
                    preloadController = null;
                });
        }

                    copyUrlText.innerText = 'Copied!';
                    showToast('Download URL copied!', 2000);
                    setTimeout(() => {
                        copyUrlIcon.style.display = 'inline-block';
                        copySuccessIcon.style.display = 'none';
                        copyUrlText.innerText = 'Copy download URL';
                    }, 2000);
                }).catch(() => {
                    const textarea = document.createElement('textarea');
                    textarea.value = currentModalSongUrl;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    copyUrlIcon.style.display = 'none';
                    copySuccessIcon.style.display = 'inline-block';
                    copyUrlText.innerText = 'Copied!';
                    showToast('Download URL copied!', 2000);
                    setTimeout(() => {
                        copyUrlIcon.style.display = 'inline-block';
                        copySuccessIcon.style.display = 'none';
                        copyUrlText.innerText = 'Copy download URL';
                    }, 2000);
                });
            } else {
                showToast('❌ No URL available for this song', 1500);
            }
        });

        closeModalBtn.addEventListener('click', () => modal.classList.remove('active'));
        modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });

        // Copy protection
        document.addEventListener('keydown', function (e) {
            if ((e.ctrlKey && (e.key === 'c' || e.key === 'x' || e.key === 'v' || e.key === 'u' || e.key === 's')) ||
                (e.key === 'F12') || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'C' || e.key === 'J'))) {
                e.preventDefault();
                return false;
            }
        });
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('dragstart', e => e.preventDefault());

        // Load folders first
        loadFolders();

        // Search clear button functionality
        const searchClear = document.getElementById('searchClear');
        const searchInputField = document.getElementById('searchInput');

        function toggleSearchClear() {
            if (searchInputField.value.length > 0) {
                searchClear.style.display = 'flex';
            } else {
                searchClear.style.display = 'none';
            }
        }

        searchInputField.addEventListener('input', toggleSearchClear);

        searchClear.addEventListener('click', () => {

            performGlobalSearch();

            searchInputField.focus();
